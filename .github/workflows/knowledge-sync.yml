# Publish the researched knowledge to the production database.
#
# WHY THIS FILE EXISTS
# --------------------
# Everything needed to get Packages 001-008 into Supabase was built and tested
# months ago: `knowledge_sync` reads the package CSVs, `scripts/run_sync.sh`
# drives it, and 114 tests cover the two. None of it had ever run against a
# database. The only evidence of execution anywhere in the repository is two
# entries in `knowledge_sync/state/sync_log.jsonl`, both `"mode": "dry-run"`,
# both `"applied": false`.
#
# There was no CI in this repository at all. The pipeline was complete and
# nothing invoked it, which is why every knowledge surface in production shows
# "This information is being prepared" — the code is right and the table is empty.
#
# This is the invocation. It is the difference between a pipeline that exists and
# a pipeline that has run.
#
# BEFORE THIS CAN WORK, an operator must add three repository secrets:
#   DATABASE_URL               postgres connection string (migrations)
#   SUPABASE_URL               project URL                (sync writes)
#   SUPABASE_SERVICE_ROLE_KEY  service role key           (sync writes)
#
# The service role key bypasses RLS. It belongs in Actions secrets and nowhere
# else — never in a NEXT_PUBLIC_* variable, never in a committed file. Until the
# secrets exist this workflow fails its preflight with a clear message rather
# than half-running.
name: Knowledge sync

on:
  # Every merge to main that touches the research or the pipeline. A package
  # edit and a live database that disagree is the state this whole sprint was
  # called to diagnose.
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "knowledge_graph/**"
      - "knowledge_sync/**"
      - "governance/vocabulary/**"
      - "scripts/**"
      - ".github/workflows/knowledge-sync.yml"

  # Weekly, so a missed push still converges rather than drifting silently.
  schedule:
    - cron: "0 3 * * 1"

  # And on demand, with a dry run by default so the first thing anyone tries is
  # the safe thing.
  workflow_dispatch:
    inputs:
      apply:
        description: "Write to the database (unchecked = plan only)"
        type: boolean
        default: false

concurrency:
  # Two syncs against one database interleave writes and make the idempotency
  # check meaningless.
  group: knowledge-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the depth-1 default.
          #
          # Two tests in the suite assert facts about git history, and both are
          # right to:
          #
          #   test_history_was_preserved_not_recopied  proves
          #     knowledge_engine/core/types.py still traces back to 71ac7e1 — i.e.
          #     the engine was recovered by merge rather than re-added by copy,
          #     which is the difference between keeping provenance and losing it.
          #
          #   test_no_page_lost_more_than_a_handful_of_lines  measures Step 2's own
          #     commit to prove the integration added to existing pages instead of
          #     rewriting them. It deliberately FAILS rather than passes when it
          #     cannot find that commit, because a test that silently examines
          #     nothing reports confidence it never earned.
          #
          # A depth-1 clone contains one commit, so both were failing on evidence
          # the checkout had thrown away — the first one accusing the repository of
          # a regression that had not happened.
          #
          # ~240 commits. The extra fetch costs a second and buys two real guards.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-sync.txt

      # The suite's own dependencies, declared rather than assumed.
      #
      # This step exists because a test started importing PyYAML and nobody
      # noticed: Debian's system Python ships it, so the suite passed on every
      # machine it was tried on and failed here with ModuleNotFoundError.
      #
      # Installed from the same requirements-dev.txt a developer installs, so
      # local and CI resolve to one set. Not `pip install pyyaml` inline — an
      # inline install is a second, undeclared dependency list that drifts from
      # the first the moment either changes.
      #
      # Kept strictly separate from requirements-sync.txt below, which is
      # installed AFTER the tests on purpose.
      - name: Test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      # Node is here for exactly one test, and it is a test worth the 30 seconds.
      #
      # `test_javascript_normalisation_matches_python` executes the JS
      # `normaliseTerm()` and the Python `normalise()` over the same eight awkward
      # inputs and asserts identical output. Every free-text skill and district
      # lookup joins through that function in both languages; a divergence makes
      # every crosswalk lookup miss and the page merely look empty.
      #
      # It self-skips when node cannot run, which is polite locally and useless in
      # CI: without this step the one place that should always check it was
      # silently checking nothing. Found by running the suite in a fresh clone.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend dependencies
        working-directory: frontend
        # `lib/knowledge.js` imports @supabase/supabase-js, so the parity test
        # needs the modules present, not just a node binary.
        run: npm ci

      - name: Tests
        run: python3 tests/run_all.py --quiet

      # Installed AFTER the tests, deliberately.
      #
      # The suite must keep proving the engine is self-contained — one of its
      # tests asserts that no engine module holds a database client — and it can
      # only prove that in an environment where the SDK is absent. Installing
      # first would make that test pass for the wrong reason.
      #
      # Installed BEFORE the plan, so the plan runs in the same interpreter state
      # the apply will. A dependency that breaks the import graph should surface
      # at the cheap step, not the one that writes.
      - name: Sync dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-sync.txt

      - name: Preflight — are the secrets present?
        id: preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          for v in DATABASE_URL SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "The knowledge pipeline is complete but has never been run against"
            echo "a database. Add these three secrets in Settings -> Secrets and"
            echo "variables -> Actions, then re-run. See docs/IMPLEMENTATION_PLAN.md."
            exit 1
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # The plan needs no credentials and proves the packages still transform
      # cleanly. It fails on any validation error or an unexpected warning.
      - name: Plan
        run: scripts/run_sync.sh --plan-only

      # Reports on the FRONTEND's access, and no longer gates the import.
      #
      # `knowledge` has to be listed under Project Settings -> API -> Exposed
      # schemas for anything to read it through PostgREST — that is the browser,
      # via the anon key. PostgREST validates the requested schema before it
      # authenticates anything, so an unlisted schema returns PGRST106 to every
      # caller, service role included.
      #
      # This step used to `exit 1`, which stopped Apply. That was wrong once the
      # sync stopped needing PostgREST: nine consecutive runs deployed a complete
      # schema and imported nothing into it, blocked by a setting that governs
      # what the public API exposes rather than what an operator process may
      # write. The import now goes over the Postgres protocol (see
      # knowledge_sync/adapters.py), so this warns and lets the data land.
      #
      # It still runs, and Verify below still fails on it, because the
      # deployment is not finished until a visitor can read the data.
      - name: Check — is the knowledge schema exposed to the API?
        if: github.event_name != 'workflow_dispatch' || inputs.apply
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail

          # ── Normalise SUPABASE_URL before building anything from it ─────────
          #
          # This step previously did "$SUPABASE_URL/rest/v1/kg_entities?…" with
          # the secret pasted straight in, and that only works if the secret is
          # EXACTLY "https://<ref>.supabase.co" with no trailing slash. Any other
          # shape produces a path with extra segments:
          #
          #   secret                              PostgREST receives   segments
          #   https://x.supabase.co               /kg_entities                1  ok
          #   https://x.supabase.co/              //rest/v1/kg_entities       4  PGRST125
          #   https://x.supabase.co/rest/v1       /rest/v1/kg_entities        3  PGRST125
          #   https://x.supabase.co/rest/v1/      //rest/v1/kg_entities       4  PGRST125
          #   "https://x.supabase.co "            %20/rest/v1/kg_entities     4  PGRST125
          #
          # PostgREST routes a table as a SINGLE path segment. More than one and
          # it answers 404 with PGRST125 "Invalid request URL" — which reads like
          # a missing table but is a malformed URL, so the old handler fell
          # through to "Unexpected HTTP 404" and said nothing useful.
          #
          # A trailing slash in a secret is invisible in the GitHub UI, so this
          # normalises rather than merely rejecting.
          raw="$SUPABASE_URL"
          base="$(printf '%s' "$raw" | tr -d '\r\n' \
                  | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          base="${base%"${base##*[!/]}"}"          # drop trailing slashes
          case "$base" in */rest/v1) base="${base%/rest/v1}" ;; esac
          base="${base%"${base##*[!/]}"}"          # and again, for ".../rest/v1/"

          case "$base" in
            https://*.*) : ;;
            *) echo "::error::SUPABASE_URL is not a project URL."
               echo "Expected: https://<project-ref>.supabase.co"
               echo "Set it in Settings -> Secrets and variables -> Actions."
               exit 1 ;;
          esac

          rest_base="$base/rest/v1"
          url="$rest_base/kg_entities?select=global_entity_id&limit=1"

          # The project ref identifies the project, so it is masked. Everything
          # else about the URL is exactly what was requested — the point of
          # printing it is to make a malformed one obvious at a glance.
          mask() { printf '%s' "$1" | sed -E 's#(https://)[^./]+#\1****#'; }
          echo "SUPABASE_URL (as stored):  $(mask "$raw")"
          echo "SUPABASE_URL (normalised): $(mask "$base")"
          echo "REST base:                 $(mask "$rest_base")"
          echo "Final request URL:         $(mask "$url")"
          if [ "$base" != "$(printf '%s' "$raw" | tr -d '\r\n')" ]; then
            echo "::warning::SUPABASE_URL has a trailing slash, a /rest/v1 suffix or"
            echo "surrounding whitespace. It was normalised for this request, but"
            echo "please fix the secret — anything else building a URL from it will"
            echo "hit the same PGRST125."
          fi

          # --write-out puts the status on its own last line; the key is passed
          # via -H from the environment and never appears in the log or in `ps`.
          # Redirects are deliberately not followed: the Authorization header
          # must not be replayed to whatever a redirect points at.
          body=$(curl -sS --max-time 20 \
                   -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                   -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                   -H "Accept-Profile: knowledge" \
                   --write-out $'\n%{http_code}' \
                   "$url")
          code=$(printf '%s' "$body" | tail -n1)
          payload=$(printf '%s' "$body" | sed '$d')

          case "$code" in
            200)
              echo "knowledge schema is exposed and reachable." ;;
            000|"")
              echo "::error::Could not reach $(mask "$base") at all (no HTTP response)."
              echo "Check the project ref in SUPABASE_URL, and that the project is not paused."
              exit 1 ;;
            401|403)
              echo "::error::SUPABASE_SERVICE_ROLE_KEY was rejected (HTTP $code)."
              echo "Check the secret against Project Settings -> API -> service_role."
              exit 1 ;;
            *)
              if printf '%s' "$payload" | grep -q "PGRST125"; then
                echo "::error::PostgREST rejected the request URL (PGRST125)."
                echo "Requested: $(mask "$url")"
                echo ""
                echo "A table must be a single path segment. This URL has more than"
                echo "one, which means SUPABASE_URL carries something it should not —"
                echo "usually a trailing slash or an existing /rest/v1 suffix."
                echo "Set it to exactly:  https://<project-ref>.supabase.co"
              elif printf '%s' "$payload" | grep -q "PGRST106"; then
                echo "::warning::The 'knowledge' schema is not exposed to the API."
                echo ""
                echo "The import will still run — it writes over the Postgres protocol"
                echo "and does not go through PostgREST. But the WEBSITE reads through"
                echo "PostgREST with the anon key, so until this is set every page will"
                echo "keep showing its 'being prepared' state even once the data is in."
                echo ""
                echo "Fix it in the Supabase Dashboard — this cannot be done in SQL:"
                echo "  Project Settings -> API -> Exposed schemas"
                echo "  add:  knowledge, user_intelligence"
                echo "  Save and wait ~30s for PostgREST to reload."
                echo ""
                echo "This is a server setting, not a permission. No key bypasses it."
                exit 0
              elif printf '%s' "$payload" | grep -q "PGRST205\|does not exist"; then
                echo "::error::The schema is exposed but knowledge.kg_entities is missing."
                echo "Run sql/deploy_knowledge.sql in the Supabase SQL Editor first,"
                echo "then confirm with sql/verify_knowledge_schema.sql."
              else
                echo "::error::Unexpected HTTP $code from PostgREST."
                echo "$payload"
              fi
              exit 1 ;;
          esac

      - name: Apply
        # Pushes and the weekly run always apply. A manual run applies only when
        # the operator ticked the box.
        if: github.event_name != 'workflow_dispatch' || inputs.apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VW_ASSUME_YES: "1"
        # run_sync.sh syncs, then runs the sync a second time and fails unless the
        # repeat reports 0 inserted, 0 updated. That is the idempotency proof, and
        # it is the check most likely to catch a real problem on first contact
        # with Postgres — a numeric returning as a string, a date as a timestamp.
        run: scripts/run_sync.sh

      - name: Verify
        if: github.event_name != 'workflow_dispatch' || inputs.apply
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # health_check.sh needs BOTH halves of the anon pair. It was getting
          # only the key, so its `[[ -n URL && -n KEY ]]` guard was false and the
          # exposure check silently did not run — the same failure shape as the
          # parity test that was skipping for want of node. It is the same
          # project URL as SUPABASE_URL; the browser client just reads it under
          # the public name.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        # health_check.sh checks schema exposure with the ANON key, because a
        # service-role read bypasses RLS and would sail past the very read
        # policies a real visitor must satisfy.
        #
        # It does NOT bypass schema exposure — see the Apply preflight above.
        run: scripts/health_check.sh

      - name: Run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-run-log
          path: |
            knowledge_sync/state/sync_log.jsonl
            knowledge_sync/state/snapshots/
          if-no-files-found: ignore
          retention-days: 30
